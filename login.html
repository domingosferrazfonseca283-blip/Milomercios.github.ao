<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Milomércios</title>
  <link rel="stylesheet" href="Style.css">
  <style>.login-box{max-width:420px;margin:60px auto;padding:24px;background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.1)}.login-box h2{text-align:center}.login-box input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:7px}.btn-login{width:100%;padding:14px;background:#27ae60;color:#fff;border:0;border-radius:7px;font-weight:700;cursor:pointer}</style>
</head>
<body>
  <div class="login-box">
    <h2>Entrar na Milomércios</h2>
    <p>Compre como cliente ou aceda ao seu painel de vendedor.</p>
    <input type="email" id="log-email" placeholder="E-mail" autocomplete="email">
    <input type="password" id="log-senha" placeholder="Palavra-passe" autocomplete="current-password">
    <button class="btn-login" id="btn-login">Entrar</button>
    <p style="text-align:center;margin-top:16px">Ainda não vende? <a href="registo.html">Criar conta de vendedor</a></p>
    <p style="text-align:center"><a href="index.html">Voltar à loja</a></p>
  </div>
  <script type="module" src="login.js"></script>
</body>
</html>
