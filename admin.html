<!DOCTYPE html>
<html lang="pt-AO">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin | Milomércios</title><link rel="stylesheet" href="Style.css"><style>.admin-container{max-width:1000px;margin:25px auto;padding:0 16px}.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.07)}input,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:7px}.btn-save{background:#27ae60;color:#fff;border:0;padding:14px;width:100%;border-radius:7px;font-weight:700}.admin-item{display:flex;justify-content:space-between;background:#f1f3f5;padding:10px;margin:6px 0;border-radius:6px}</style></head>
<body><header><button id="btn-logout" style="background:transparent;color:white;border:1px solid white;padding:6px 10px;border-radius:4px">Sair</button><div class="logo">Admin Milomércios</div><a href="index.html" style="color:white;text-decoration:none">Ver Loja</a></header>
<main class="admin-container"><div class="card"><h2>Painel do Administrador</h2><p id="admin-info">A validar acesso...</p></div><div class="card"><h3>Configuração da subscrição dos vendedores</h3><label>Plano<select id="sub-plano"><option value="semanal">Semanal</option><option value="mensal">Mensal</option></select></label><label>Valor (Kz)<input id="sub-valor" type="number" min="0" placeholder="5000"></label><button class="btn-save" id="btn-sub">Guardar configuração</button></div><div class="card"><h3>Produtos locais (compatibilidade)</h3><div id="admin-list">A carregar...</div></div></main>
<script type="module" src="admin.js"></script></body></html>
