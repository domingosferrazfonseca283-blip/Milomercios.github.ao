<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Checkout seguro do Milomércios">
    <title>Checkout | Milomércios</title>
    <link rel="stylesheet" href="Style.css">
    <style>
        body { background: #f5f7fa; }
        .checkout { max-width: 1000px; margin: 24px auto; padding: 0 16px 40px; }
        .steps { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
        .step { flex:1; min-width:150px; padding:12px; background:#fff; border-radius:8px; color:#68707a; }
        .step.active { font-weight:700; color:#111; box-shadow:0 0 0 2px #27ae60 inset; }
        .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:20px; }
        .card { background:#fff; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.07); }
        label { display:block; margin:12px 0 6px; font-weight:600; }
        input, textarea, select { width:100%; box-sizing:border-box; padding:12px; border:1px solid #d7dce1; border-radius:8px; font:inherit; }
        textarea { min-height:80px; resize:vertical; }
        .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .item { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid #eee; }
        .total { display:flex; justify-content:space-between; font-size:1.2rem; font-weight:800; padding-top:16px; }
        .btn { width:100%; margin-top:16px; padding:14px; border:0; border-radius:8px; background:#27ae60; color:#fff; font-size:1rem; font-weight:700; cursor:pointer; }
        .btn.secondary { background:#eef1f4; color:#222; }
        .error { color:#c0392b; font-size:.9rem; margin-top:5px; }
        .success { text-align:center; padding:30px 10px; }
        .success h2 { color:#27ae60; }
        @media (max-width:700px) { .grid, .row { grid-template-columns:1fr; } .checkout { margin-top:12px; } }
    </style>
</head>
<body>
    <header>
        <div class="logo">Milomércios</div>
        <a href="carrinho.html" style="color:white;text-decoration:none;">Voltar ao carrinho</a>
    </header>

    <main class="checkout">
        <div class="steps">
            <div class="step active">1. Dados do cliente</div>
            <div class="step active">2. Resumo da compra</div>
            <div class="step active">3. Pagamento</div>
        </div>

        <div id="checkout-app"></div>
    </main>

    <script type="module" src="checkout.js"></script>
</body>
</html>
